    <title>Misty Imagination</title>
    <style>
        /* ===== CSS Reset & Base ===== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-text-size-adjust: none;
        }

        html {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden;
        }

        body {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            background: #000000;
            font-family: Impact, 'Arial Black', sans-serif;
            color: #FFFFFF;
            font-weight: 700;
            touch-action: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== Safe Area Variables ===== */
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        /* ===== Auth Container - Perfect Centering ===== */
        #auth-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
            z-index: 100;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .auth-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 500px;
            padding: 40px 24px;
        }

        .auth-button {
            background: transparent;
            color: #FFFFFF;
            border: none;
            padding: 24px 32px;
            font-size: clamp(36px, 10vw, 56px);
            font-weight: 400;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: Impact, 'Arial Black', sans-serif;
            position: relative;
            overflow: hidden;
            letter-spacing: -0.02em;
            line-height: 0.95;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.35), 0 0 40px rgba(255, 255, 255, 0.15);
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .auth-button:active {
            transform: scale(0.96);
            opacity: 0.75;
        }

        .auth-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .auth-button-loading::after {
            content: "";
            position: absolute;
            width: 28px;
            height: 28px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .button-text-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: opacity 0.2s ease;
        }

        .auth-button-loading .button-text-container {
            opacity: 0;
        }

        .button-main-text {
            font-size: 1em;
            text-align: center;
            white-space: nowrap;
        }

        .button-sub-text {
            font-size: 0.32em;
            letter-spacing: 0.25em;
            opacity: 0.7;
            text-align: center;
            text-transform: uppercase;
        }

        /* ===== Content Container - Perfect Centering ===== */
        #content-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: none;
            opacity: 0;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        }

        #content-container.active {
            opacity: 1;
        }

        .content-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ===== Image Container - Perfect Centering ===== */
        .image-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #display-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            transition: opacity 0.4s ease, transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #display-image.loading {
            opacity: 0;
            transform: scale(1.05);
        }

        #display-image.loaded {
            opacity: 1;
            transform: scale(1);
        }

        /* ===== Text Overlay - Perfect Centering ===== */
        .text-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            pointer-events: none;
            padding: 20px;
        }

        .main-text {
            font-size: clamp(48px, 15vw, 120px);
            letter-spacing: -0.03em;
            line-height: 0.9;
            text-align: center;
            text-shadow: 0 2px 30px rgba(0, 0, 0, 0.5), 0 0 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 8px;
            opacity: 0.95;
        }

        .sub-text {
            font-size: clamp(24px, 6vw, 48px);
            letter-spacing: 0.15em;
            line-height: 1;
            text-align: center;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
            opacity: 0.85;
        }

        .chinese-text {
            font-size: clamp(32px, 8vw, 64px);
            letter-spacing: 0.2em;
            margin-top: 16px;
            opacity: 0.9;
            text-shadow: 0 2px 25px rgba(0, 0, 0, 0.5);
        }

        /* ===== Settings Button ===== */
        .settings-btn {
            position: absolute;
            bottom: calc(24px + var(--safe-bottom));
            right: calc(24px + var(--safe-right));
            width: 52px;
            height: 52px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 20;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto;
        }

        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .settings-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.15);
        }

        .settings-btn svg {
            width: 24px;
            height: 24px;
            fill: #FFFFFF;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .settings-btn.active svg {
            transform: rotate(45deg);
        }

        /* ===== Settings Modal - Perfect Centering ===== */
        .settings-modal {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        }

        .settings-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .settings-content {
            width: 90%;
            max-width: 420px;
            background: rgba(30, 30, 30, 0.95);
            border-radius: 24px;
            padding: 28px;
            transform: translateY(30px) scale(0.95);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
        }

        .settings-modal.active .settings-content {
            transform: translateY(0) scale(1);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .settings-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .close-btn:active {
            transform: scale(0.9);
        }

        .close-btn svg {
            width: 18px;
            height: 18px;
            stroke: #FFFFFF;
            stroke-width: 2;
        }

        .settings-section {
            margin-bottom: 24px;
        }

        .settings-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            opacity: 0.6;
            margin-bottom: 12px;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px dashed rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
            gap: 10px;
        }

        .file-input-label:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .file-input-label svg {
            width: 20px;
            height: 20px;
            stroke: #FFFFFF;
            stroke-width: 2;
        }

        .text-input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .text-input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.2s ease;
            outline: none;
        }

        .text-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .text-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: #FFFFFF;
            color: #000000;
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-secondary:active {
            transform: scale(0.97);
        }

        /* ===== Loading State ===== */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* ===== Responsive Adjustments ===== */
        @media (max-width: 380px) {
            .settings-content {
                width: 92%;
                padding: 22px;
            }
            
            .auth-button {
                padding: 20px 24px;
            }
        }

        @media (min-width: 768px) {
            .settings-content {
                max-width: 460px;
                padding: 32px;
            }
        }

        /* ===== Reduced Motion ===== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ===== iOS Specific Fixes ===== */
        @supports (-webkit-touch-callout: none) {
            html, body {
                min-height: -webkit-fill-available;
            }
            
            #auth-container,
            #content-container,
            .settings-modal {
                height: -webkit-fill-available;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- Auth Container -->
    <div id="auth-container">
        <div class="auth-content">
            <button class="auth-button" id="auth-btn" aria-label="进入应用">
                <span class="button-text-container">
                    <span class="button-main-text">MISTY</span>
                    <span class="button-sub-text">IMAGINATION</span>
                </span>
            </button>
        </div>
    </div>

    <!-- Content Container -->
    <div id="content-container">
        <div class="content-wrapper">
            <div class="image-container">
                <img id="display-image" src="Mist.png" alt="Misty" class="loading">
            </div>
            <div class="text-overlay">
                <div class="main-text" id="main-text">Misty</div>
                <div class="sub-text" id="sub-text">Imagination</div>
                <div class="chinese-text" id="chinese-text">霧</div>
            </div>
            <button class="settings-btn" id="settings-btn" aria-label="设置">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97 0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65A.488.488 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1 0 .33.03.66.07 1l-2.11 1.63c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.63Z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="settings-modal" id="settings-modal">
        <div class="settings-content">
            <div class="settings-header">
                <h2 class="settings-title">Settings</h2>
                <button class="close-btn" id="close-settings" aria-label="关闭">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            
            <div class="settings-section">
                <h3 class="section-title">Change Picture</h3>
                <div class="file-input-wrapper">
                    <input type="file" id="image-input" accept="image/*">
                    <label for="image-input" class="file-input-label">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>Select Picture</span>
                    </label>
                </div>
            </div>
            
            <div class="settings-section">
                <h3 class="section-title">Change Texts</h3>
                <div class="text-input-group">
                    <input type="text" class="text-input" id="main-text-input" placeholder="Main Text" value="Misty">
                    <input type="text" class="text-input" id="sub-text-input" placeholder="Sub Text" value="Imagination">
                    <input type="text" class="text-input" id="chinese-text-input" placeholder="Chinese Text" value="霧">
                </div>
                <div class="button-group">
                    <button class="btn btn-primary" id="save-btn">Save</button>
                    <button class="btn btn-secondary" id="cancel-btn">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== App State =====
        const AppState = {
            isAuthenticated: false,
            credentialId: null,
            texts: {
                main: 'Misty',
                sub: 'Imagination',
                chinese: '霧'
            },
            imageData: null
        };

        // ===== DOM Elements =====
        const DOM = {
            loadingOverlay: document.getElementById('loading-overlay'),
            authContainer: document.getElementById('auth-container'),
            authBtn: document.getElementById('auth-btn'),
            contentContainer: document.getElementById('content-container'),
            displayImage: document.getElementById('display-image'),
            mainText: document.getElementById('main-text'),
            subText: document.getElementById('sub-text'),
            chineseText: document.getElementById('chinese-text'),
            settingsBtn: document.getElementById('settings-btn'),
            settingsModal: document.getElementById('settings-modal'),
            closeSettings: document.getElementById('close-settings'),
            imageInput: document.getElementById('image-input'),
            mainTextInput: document.getElementById('main-text-input'),
            subTextInput: document.getElementById('sub-text-input'),
            chineseTextInput: document.getElementById('chinese-text-input'),
            saveBtn: document.getElementById('save-btn'),
            cancelBtn: document.getElementById('cancel-btn')
        };

        // ===== Utility Functions =====
        const Utils = {
            loadFromStorage: () => {
                try {
                    const saved = localStorage.getItem('misty_app_data');
                    if (saved) {
                        const data = JSON.parse(saved);
                        AppState.texts = data.texts || AppState.texts;
                        AppState.imageData = data.imageData || null;
                        return true;
                    }
                } catch (e) {
                    console.warn('Failed to load from storage:', e);
                }
                return false;
            },

            saveToStorage: () => {
                try {
                    localStorage.setItem('misty_app_data', JSON.stringify({
                        texts: AppState.texts,
                        imageData: AppState.imageData
                    }));
                } catch (e) {
                    console.warn('Failed to save to storage:', e);
                }
            },

            setLoading: (isLoading) => {
                if (isLoading) {
                    DOM.authBtn.classList.add('auth-button-loading');
                    DOM.authBtn.disabled = true;
                } else {
                    DOM.authBtn.classList.remove('auth-button-loading');
                    DOM.authBtn.disabled = false;
                }
            },

            updateTextDisplay: () => {
                DOM.mainText.textContent = AppState.texts.main;
                DOM.subText.textContent = AppState.texts.sub;
                DOM.chineseText.textContent = AppState.texts.chinese;
            },

            updateImageDisplay: () => {
                if (AppState.imageData) {
                    DOM.displayImage.src = AppState.imageData;
                }
            }
        };

        // ===== Auth Manager =====
        const AuthManager = {
            init: () => {
                // Check if already authenticated in this session
                const sessionAuth = sessionStorage.getItem('misty_session_auth');
                if (sessionAuth === 'true') {
                    AppState.isAuthenticated = true;
                    UI.showContent();
                    return;
                }

                DOM.authBtn.addEventListener('click', AuthManager.handleAuth);
            },

            handleAuth: async () => {
                Utils.setLoading(true);
                
                try {
                    // Simulate auth delay for better UX
                    await new Promise(resolve => setTimeout(resolve, 600));
                    
                    // For demo: simple auth success
                    // In production, replace with actual WebAuthn or other auth
                    AppState.isAuthenticated = true;
                    sessionStorage.setItem('misty_session_auth', 'true');
                    UI.showContent();
                } catch (error) {
                    console.error('Auth failed:', error);
                } finally {
                    Utils.setLoading(false);
                }
            }
        };

        // ===== UI Manager =====
        const UI = {
            showContent: () => {
                DOM.authContainer.style.opacity = '0';
                
                setTimeout(() => {
                    DOM.authContainer.style.display = 'none';
                    DOM.contentContainer.style.display = 'flex';
                    
                    // Force reflow
                    DOM.contentContainer.offsetHeight;
                    
                    requestAnimationFrame(() => {
                        DOM.contentContainer.classList.add('active');
                    });
                }, 400);
            },

            openSettings: () => {
                DOM.settingsModal.classList.add('active');
                DOM.settingsBtn.classList.add('active');
                
                // Populate inputs
                DOM.mainTextInput.value = AppState.texts.main;
                DOM.subTextInput.value = AppState.texts.sub;
                DOM.chineseTextInput.value = AppState.texts.chinese;
            },

            closeSettings: () => {
                DOM.settingsModal.classList.remove('active');
                DOM.settingsBtn.classList.remove('active');
            },

            hideLoading: () => {
                DOM.loadingOverlay.classList.add('hidden');
            }
        };

        // ===== Settings Manager =====
        const SettingsManager = {
            init: () => {
                DOM.settingsBtn.addEventListener('click', UI.openSettings);
                DOM.closeSettings.addEventListener('click', UI.closeSettings);
                DOM.settingsModal.addEventListener('click', (e) => {
                    if (e.target === DOM.settingsModal) UI.closeSettings();
                });

                DOM.imageInput.addEventListener('change', SettingsManager.handleImageChange);
                DOM.saveBtn.addEventListener('click', SettingsManager.saveSettings);
                DOM.cancelBtn.addEventListener('click', UI.closeSettings);
            },

            handleImageChange: (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    AppState.imageData = event.target.result;
                    Utils.updateImageDisplay();
                    Utils.saveToStorage();
                };
                reader.readAsDataURL(file);
            },

            saveSettings: () => {
                AppState.texts.main = DOM.mainTextInput.value || 'Misty';
                AppState.texts.sub = DOM.subTextInput.value || 'Imagination';
                AppState.texts.chinese = DOM.chineseTextInput.value || '霧';
                
                Utils.updateTextDisplay();
                Utils.saveToStorage();
                UI.closeSettings();
            }
        };

        // ===== Image Manager =====
        const ImageManager = {
            init: () => {
                DOM.displayImage.addEventListener('load', () => {
                    DOM.displayImage.classList.remove('loading');
                    DOM.displayImage.classList.add('loaded');
                });

                DOM.displayImage.addEventListener('error', () => {
                    console.warn('Image failed to load');
                    DOM.displayImage.classList.remove('loading');
                });
            }
        };

        // ===== Initialization =====
        function initApp() {
            // Load saved data
            Utils.loadFromStorage();
            
            // Apply saved data
            Utils.updateTextDisplay();
            Utils.updateImageDisplay();
            
            // Initialize managers
            AuthManager.init();
            SettingsManager.init();
            ImageManager.init();
            
            // Hide loading overlay
            setTimeout(UI.hideLoading, 300);
        }

        // ===== Event Listeners =====
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

        // Prevent scroll/bounce on iOS
        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('.settings-content')) return;
            e.preventDefault();
        }, { passive: false });

        // Handle visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // App going to background
            } else {
                // App coming to foreground
            }
        });

        // Prevent double-tap zoom on iOS
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });
    </script>
</body>
</html>

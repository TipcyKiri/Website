<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Correspondence">
    <meta name="theme-color" content="#f7f4ef">
    <link rel="icon" type="image/png" href="Mist.png">
    <link rel="apple-touch-icon" href="Mist.png">
    <title>Correspondence</title>
    <style>
        :root {
            --bg: #f7f4ef;
            --surface: #ffffff;
            --ink: #1a1a1a;
            --ink-secondary: #5c5c5c;
            --ink-tertiary: #9e9e9e;
            --accent: #b5493e;
            --accent-muted: #d4a59e;
            --border: rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        html {
            background: var(--bg);
            overscroll-behavior: none;
            scroll-behavior: smooth;
            -webkit-text-size-adjust: none;
            text-size-adjust: none;
        }

        body {
            font-family: 'PingFang SC', 'Helvetica Neue', sans-serif;
            color: var(--ink);
            background: var(--bg);
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .font-en {
            font-family: Impact, 'Arial Black', sans-serif;
            font-weight: 400;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 0 28px;
        }

        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: var(--accent);
            z-index: 200;
            width: 0%;
            transition: width 0.1s linear;
            opacity: 0;
        }

        .progress-bar.active {
            opacity: 1;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(247, 244, 239, 0.92);
            backdrop-filter: blur(24px) saturate(1.2);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
            border-bottom: 1px solid var(--border);
            padding: calc(16px + env(safe-area-inset-top)) 0 16px;
        }

        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .logo {
            font-family: Impact, sans-serif;
            font-size: 20px;
            color: var(--ink);
            letter-spacing: 1.5px;
        }

        .header-action {
            font-family: Impact, sans-serif;
            font-size: 12px;
            color: var(--ink-tertiary);
            background: none;
            border: none;
            cursor: pointer;
            letter-spacing: 0.8px;
            padding: 6px 0;
            transition: color 0.2s;
        }

        .header-action:hover {
            color: var(--accent);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 48px 0 24px;
            position: relative;
        }

        .section-title {
            font-family: Impact, sans-serif;
            font-size: 11px;
            color: var(--ink-tertiary);
            letter-spacing: 2.5px;
        }

        .sort-wrapper {
            position: relative;
        }

        .sort-toggle {
            font-family: Impact, sans-serif;
            font-size: 11px;
            color: var(--ink-secondary);
            background: none;
            border: none;
            cursor: pointer;
            letter-spacing: 1px;
            padding: 4px 0;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .sort-toggle::after {
            content: "▾";
            font-size: 10px;
            opacity: 0.6;
        }

        .sort-toggle:hover {
            color: var(--accent);
        }

        .sort-dropdown {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 3px;
            min-width: 180px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.06);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-4px);
            transition: all 0.2s ease;
            z-index: 50;
            padding: 6px 0;
        }

        .sort-dropdown.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .sort-option {
            font-family: Impact, sans-serif;
            font-size: 11px;
            letter-spacing: 0.8px;
            color: var(--ink-secondary);
            padding: 10px 18px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .sort-option:hover {
            background: rgba(181, 73, 62, 0.04);
            color: var(--accent);
        }

        .sort-option.active {
            color: var(--accent);
        }

        .upload-zone {
            border: 1px dashed var(--border);
            border-radius: 3px;
            padding: 52px 24px;
            text-align: center;
            margin-bottom: 36px;
            transition: all 0.3s ease;
            cursor: pointer;
            background: transparent;
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: var(--accent-muted);
            background: rgba(181, 73, 62, 0.015);
        }

        .upload-zone .label-en {
            font-family: Impact, sans-serif;
            font-size: 12px;
            color: var(--ink-tertiary);
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .upload-zone .label-cn {
            font-family: 'PingFang SC', sans-serif;
            font-weight: 300;
            font-size: 14px;
            color: var(--ink-secondary);
            letter-spacing: 0.5px;
        }

        .letters {
            display: flex;
            flex-direction: column;
            gap: 1px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 40px;
        }

        .letter-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 24px;
            background: var(--surface);
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }

        .letter-item::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--accent);
            transform: scaleY(0);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .letter-item:hover::before {
            transform: scaleY(1);
        }

        .letter-item:hover {
            background: #fdfcfb;
        }

        .letter-item:active {
            transform: scale(0.996);
        }

        .letter-info {
            flex: 1;
            min-width: 0;
            margin-right: 20px;
        }

        .letter-title {
            font-family: 'PingFang SC', sans-serif;
            font-weight: 400;
            font-size: 16px;
            color: var(--ink);
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .letter-meta {
            font-family: Impact, sans-serif;
            font-size: 10.5px;
            color: var(--ink-tertiary);
            letter-spacing: 0.8px;
        }

        .letter-arrow {
            font-family: Impact, sans-serif;
            font-size: 16px;
            color: var(--ink-tertiary);
            transition: all 0.3s ease;
            opacity: 0.4;
        }

        .letter-item:hover .letter-arrow {
            transform: translateX(5px);
            color: var(--accent);
            opacity: 1;
        }

        .empty {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-en {
            font-family: Impact, sans-serif;
            font-size: 13px;
            color: var(--ink-tertiary);
            letter-spacing: 3px;
            margin-bottom: 14px;
        }

        .empty-cn {
            font-family: 'PingFang SC', sans-serif;
            font-weight: 300;
            font-size: 15px;
            color: var(--ink-secondary);
            margin-bottom: 36px;
            letter-spacing: 0.5px;
        }

        .reader {
            display: none;
            min-height: 100vh;
            padding-bottom: calc(100px + env(safe-area-inset-bottom));
        }

        .reader.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .reader-header {
            padding: calc(32px + env(safe-area-inset-top)) 0 40px;
            margin-bottom: 48px;
            border-bottom: 1px solid var(--border);
        }

        .reader-back {
            font-family: Impact, sans-serif;
            font-size: 11px;
            color: var(--ink-tertiary);
            letter-spacing: 1.5px;
            background: none;
            border: none;
            cursor: pointer;
            margin-bottom: 28px;
            padding: 0;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .reader-back:hover {
            color: var(--accent);
        }

        .reader-title {
            font-family: 'PingFang SC', sans-serif;
            font-weight: 400;
            font-size: 30px;
            line-height: 1.4;
            color: var(--ink);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .reader-subtitle {
            font-family: 'PingFang SC', sans-serif;
            font-weight: 300;
            font-size: 15px;
            line-height: 1.5;
            color: var(--ink-secondary);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .reader-subtitle.hidden {
            display: none;
        }

        .reader-date {
            font-family: Impact, sans-serif;
            font-size: 11px;
            color: var(--ink-tertiary);
            letter-spacing: 1.5px;
            margin-top: 4px;
        }

        .reader-body {
            font-family: 'PingFang SC', sans-serif;
            font-weight: 300;
            font-size: 17px;
            line-height: 1.9;
            color: var(--ink);
            word-wrap: break-word;
            overflow-wrap: break-word;
            letter-spacing: 0.03em;
            hanging-punctuation: allow-end;
        }

        .reader-body .stanza {
            margin-bottom: 1.8em;
        }

        .reader-body .stanza:last-child {
            margin-bottom: 0;
        }

        .reader-body .stanza p {
            margin-bottom: 0.3em;
            text-indent: 0;
        }

        .reader-body .stanza p:last-child {
            margin-bottom: 0;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 56px 0;
            gap: 20px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border);
            max-width: 100px;
        }

        .divider-mark {
            font-family: Impact, sans-serif;
            font-size: 10px;
            color: var(--ink-tertiary);
            letter-spacing: 6px;
            opacity: 0.6;
        }

        .reader-end {
            text-align: center;
            margin-top: 64px;
            padding-bottom: 60px;
        }

        .reader-end-en {
            font-family: Impact, sans-serif;
            font-size: 10px;
            color: var(--ink-tertiary);
            letter-spacing: 4px;
            opacity: 0.7;
        }

        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 28px calc(16px + env(safe-area-inset-bottom));
            background: rgba(247, 244, 239, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .bar-info {
            font-family: Impact, sans-serif;
            font-size: 10.5px;
            color: var(--ink-tertiary);
            letter-spacing: 0.8px;
        }

        .bar-nav {
            display: flex;
            gap: 24px;
        }

        .bar-btn {
            font-family: Impact, sans-serif;
            font-size: 11px;
            color: var(--ink-secondary);
            letter-spacing: 0.8px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 0;
            transition: color 0.2s;
            text-transform: uppercase;
            position: relative;
        }

        .bar-btn::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--accent);
            transition: width 0.3s ease;
        }

        .bar-btn:hover {
            color: var(--accent);
        }

        .bar-btn:hover::after {
            width: 100%;
        }

        .bar-btn:disabled {
            color: var(--ink-tertiary);
            cursor: not-allowed;
            opacity: 0.4;
        }

        .bar-btn:disabled::after {
            display: none;
        }

        .hidden {
            display: none !important;
        }

        #fileInput {
            display: none;
        }

        ::-webkit-scrollbar {
            width: 3px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.06);
            border-radius: 2px;
        }

        @media (max-width: 640px) {
            .container {
                padding: 0 22px;
            }
            .reader-title {
                font-size: 26px;
                line-height: 1.45;
            }
            .reader-subtitle {
                font-size: 14px;
            }
            .reader-body {
                font-size: 16px;
                line-height: 1.85;
            }
            .reader-body .stanza {
                margin-bottom: 1.6em;
            }
            .reader-body .stanza p {
                margin-bottom: 0.25em;
            }
            .letter-item {
                padding: 18px 20px;
            }
            .section-header {
                margin-top: 36px;
            }
            .sort-dropdown {
                right: -10px;
            }
            .reader-header {
                padding: calc(28px + env(safe-area-inset-top)) 0 32px;
                margin-bottom: 40px;
            }
        }

        ::selection {
            background: rgba(181, 73, 62, 0.12);
            color: var(--ink);
        }
    </style>
</head>
<body>
    <div class="progress-bar" id="progressBar"></div>
    <input type="file" id="fileInput" accept=".txt" multiple webkitdirectory>

    <div class="library" id="library">
        <div class="header">
            <div class="container header-inner">
                <div class="logo">CORRESPONDENCE</div>
                <div>
                    <button class="header-action" onclick="document.getElementById('fileInput').click()">IMPORT</button>
                    <button class="header-action" onclick="app.clear()" style="margin-left: 18px;">CLEAR</button>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="section-header">
                <div class="section-title">Collection</div>
                <div class="sort-wrapper">
                    <button class="sort-toggle" id="sortToggle" onclick="app.toggleSort(event)">
                        SORT BY <span id="sortLabel" style="color: var(--accent);">DATE ↓</span>
                    </button>
                    <div class="sort-dropdown" id="sortDropdown">
                        <div class="sort-option active" onclick="app.setSort('date', 'desc', 'DATE ↓')">DATE — NEWEST</div>
                        <div class="sort-option" onclick="app.setSort('date', 'asc', 'DATE ↑')">DATE — OLDEST</div>
                        <div class="sort-option" onclick="app.setSort('title', 'asc', 'TITLE A-Z')">TITLE — A-Z</div>
                        <div class="sort-option" onclick="app.setSort('title', 'desc', 'TITLE Z-A')">TITLE — Z-A</div>
                        <div class="sort-option" onclick="app.setSort('length', 'desc', 'LENGTH ↓')">LENGTH — LONG</div>
                        <div class="sort-option" onclick="app.setSort('length', 'asc', 'LENGTH ↑')">LENGTH — SHORT</div>
                    </div>
                </div>
            </div>

            <div class="upload-zone" id="dropZone">
                <div class="label-en">DRAG & DROP .TXT FILES</div>
                <div class="label-cn">或将文件拖入此处</div>
            </div>

            <div id="lettersContainer"></div>

            <div class="empty hidden" id="emptyState">
                <div class="empty-en">NO LETTERS</div>
                <div class="empty-cn">案头空空，尚无信笺</div>
                <button class="header-action" onclick="document.getElementById('fileInput').click()" style="font-size: 13px; color: var(--accent); letter-spacing: 1px;">IMPORT FILES</button>
            </div>
        </div>
    </div>

    <div class="reader" id="reader">
        <div class="container">
            <div class="reader-header">
                <button class="reader-back" onclick="app.back()">← BACK TO COLLECTION</button>
                <h1 class="reader-title" id="rTitle">Untitled</h1>
                <div class="reader-subtitle hidden" id="rSubtitle"></div>
                <div class="reader-date" id="rDate">--</div>
            </div>

            <div class="reader-body" id="rBody"></div>

            <div class="divider">
                <div class="divider-line"></div>
                <div class="divider-mark">§</div>
                <div class="divider-line"></div>
            </div>

            <div class="reader-end">
                <div class="reader-end-en">End of Letter</div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="bar-info" id="barInfo">0 CHARACTERS</div>
            <div class="-bar-nav">
                <button class="bar-btn" id="btnPrev" onclick="app.prev()">← Prev</button>
                <button class="bar-btn" id="btnNext" onclick="app.next()">Next →</button>
            </div>
        </div>
    </div>

    <script>
        class App {
            constructor() {
                this.articles = [];
                this.currentId = null;
                this.sortField = 'date';
                this.sortOrder = 'desc';
                this.init();
            }

            init() {
                const input = document.getElementById('fileInput');
                input.addEventListener('change', e => this.load(e.target.files));

                const zone = document.getElementById('dropZone');
                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
                    zone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); });
                });
                ['dragenter', 'dragover'].forEach(evt => {
                    zone.addEventListener(evt, () => zone.classList.add('dragover'));
                });
                ['dragleave', 'drop'].forEach(evt => {
                    zone.addEventListener(evt, () => zone.classList.remove('dragover'));
                });
                zone.addEventListener('drop', e => this.load(e.dataTransfer.files));
                zone.addEventListener('click', () => input.click());

                document.addEventListener('click', (e) => {
                    const wrapper = document.querySelector('.sort-wrapper');
                    if (!wrapper.contains(e.target)) {
                        document.getElementById('sortDropdown').classList.remove('open');
                    }
                });

                window.addEventListener('scroll', () => this.updateProgress());
                this.render();
            }

            load(files) {
                const txts = Array.from(files).filter(f => f.name.endsWith('.txt'));
                if (!txts.length) return;

                let done = 0;
                txts.forEach(file => {
                    const r = new FileReader();
                    r.onload = e => {
                        this.articles.push({
                            id: Date.now() + Math.random().toString(36).slice(2),
                            title: file.name.replace(/\.txt$/i, ''),
                            date: new Date(file.lastModified).toLocaleDateString('zh-CN'),
                            timestamp: file.lastModified,
                            content: e.target.result,
                            chars: e.target.result.length
                        });
                        if (++done === txts.length) {
                            this.render();
                        }
                    };
                    r.readAsText(file, 'UTF-8');
                });
            }

            getSorted() {
                const sorted = [...this.articles];
                sorted.sort((a, b) => {
                    let cmp = 0;
                    if (this.sortField === 'date') {
                        cmp = a.timestamp - b.timestamp;
                    } else if (this.sortField === 'title') {
                        cmp = a.title.localeCompare(b.title, 'zh-CN');
                    } else if (this.sortField === 'length') {
                        cmp = a.chars - b.chars;
                    }
                    return this.sortOrder === 'asc' ? cmp : -cmp;
                });
                return sorted;
            }

            getSortedIndex(id) {
                return this.getSorted().findIndex(a => a.id === id);
            }

            render() {
                const container = document.getElementById('lettersContainer');
                const empty = document.getElementById('emptyState');
                const zone = document.getElementById('dropZone');

                if (!this.articles.length) {
                    container.innerHTML = '';
                    empty.classList.remove('hidden');
                    zone.classList.remove('hidden');
                    return;
                }

                empty.classList.add('hidden');
                zone.classList.add('hidden');

                const items = this.getSorted();

                container.innerHTML = `<div class="letters">` + 
                    items.map(a => `
                        <div class="letter-item" onclick="app.open('${a.id}')">
                            <div class="letter-info">
                                <div class="letter-title">${this.esc(a.title)}</div>
                                <div class="letter-meta">${a.date} · ${a.chars.toLocaleString()} CHARS</div>
                            </div>
                            <div class="letter-arrow">→</div>
                        </div>
                    `).join('') + `</div>`;
            }

            parseArticle(content) {
                const text = content.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                const lines = text.split('\n');
                
                let extractedTitle = null;
                let subtitle = null;
                let bodyStart = 0;
                
                if (lines.length >= 3) {
                    const first = lines[0].trim();
                    const second = lines[1].trim();
                    
                    if (first && second &&
                        first.length > 0 && first.length <= 80 &&
                        second.length > 0 && second.length <= 80 &&
                        !/^\d+[.、\s]/.test(second) &&
                        !/^\d+[.、\s]/.test(first)) {
                        
                        extractedTitle = first;
                        subtitle = second;
                        bodyStart = 2;
                        
                        while (bodyStart < lines.length && lines[bodyStart].trim() === '') {
                            bodyStart++;
                        }
                    }
                }
                
                const bodyLines = lines.slice(bodyStart);
                const bodyHtml = this.renderStanzas(bodyLines);
                
                return { title: extractedTitle, subtitle, bodyHtml };
            }

            renderStanzas(lines) {
                const stanzas = [];
                let current = [];
                
                lines.forEach(line => {
                    if (line.trim() === '') {
                        if (current.length > 0) {
                            stanzas.push(current);
                            current = [];
                        }
                    } else {
                        current.push(line);
                    }
                });
                
                if (current.length > 0) {
                    stanzas.push(current);
                }
                
                return stanzas.map(stanzaLines => {
                    const inner = stanzaLines
                        .map(l => `<p>${this.esc(l)}</p>`)
                        .join('');
                    return `<div class="stanza">${inner}</div>`;
                }).join('');
            }

            open(id) {
                this.currentId = id;
                const a = this.articles.find(x => x.id === id);
                if (!a) return;

                const parsed = this.parseArticle(a.content);
                
                document.getElementById('rTitle').textContent = parsed.title || a.title;
                
                const subEl = document.getElementById('rSubtitle');
                if (parsed.subtitle) {
                    subEl.textContent = parsed.subtitle;
                    subEl.classList.remove('hidden');
                } else {
                    subEl.classList.add('hidden');
                }
                
                document.getElementById('rDate').textContent = a.date;
                document.getElementById('barInfo').textContent = `${a.chars.toLocaleString()} CHARACTERS`;
                document.getElementById('rBody').innerHTML = parsed.bodyHtml;
                
                this.updateNav();

                document.getElementById('library').classList.add('hidden');
                document.getElementById('reader').classList.add('active');
                document.getElementById('progressBar').classList.add('active');
                window.scrollTo(0, 0);
            }

            back() {
                document.getElementById('reader').classList.remove('active');
                document.getElementById('library').classList.remove('hidden');
                document.getElementById('progressBar').classList.remove('active');
                this.currentId = null;
            }

            prev() {
                const idx = this.getSortedIndex(this.currentId);
                const sorted = this.getSorted();
                if (idx > 0) this.open(sorted[idx - 1].id);
            }

            next() {
                const idx = this.getSortedIndex(this.currentId);
                const sorted = this.getSorted();
                if (idx < sorted.length - 1) this.open(sorted[idx + 1].id);
            }

            updateNav() {
                const idx = this.getSortedIndex(this.currentId);
                const sorted = this.getSorted();
                document.getElementById('btnPrev').disabled = idx <= 0;
                document.getElementById('btnNext').disabled = idx >= sorted.length - 1;
            }

            updateProgress() {
                if (!this.currentId) return;
                const scrollTop = window.scrollY || document.documentElement.scrollTop;
                const docHeight = document.documentElement.scrollHeight - window.innerHeight;
                const pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
                document.getElementById('progressBar').style.width = pct + '%';
            }

            toggleSort(e) {
                e.stopPropagation();
                document.getElementById('sortDropdown').classList.toggle('open');
            }

            setSort(field, order, label) {
                this.sortField = field;
                this.sortOrder = order;
                document.getElementById('sortLabel').textContent = label;
                
                document.querySelectorAll('.sort-option').forEach(el => el.classList.remove('active'));
                event.target.classList.add('active');
                
                document.getElementById('sortDropdown').classList.remove('open');
                this.render();
            }

            clear() {
                if (!this.articles.length) return;
                if (confirm('Clear all letters?')) {
                    this.articles = [];
                    this.currentId = null;
                    this.render();
                    this.back();
                }
            }

            esc(t) {
                const d = document.createElement('div');
                d.textContent = t;
                return d.innerHTML;
            }
        }

        const app = new App();

        let last = 0;
        document.addEventListener('touchend', e => {
            const now = Date.now();
            if (now - last <= 300) e.preventDefault();
            last = now;
        }, false);

        document.addEventListener('keydown', e => {
            if (!document.getElementById('reader').classList.contains('active')) return;
            if (e.key === 'ArrowLeft') app.prev();
            if (e.key === 'ArrowRight') app.next();
            if (e.key === 'Escape') app.back();
        });
    </script>
</body>
</html>

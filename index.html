<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- iOS Web Clip 核心适配配置 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="iOS26 AI Chat">
    <!-- iOS 主屏幕图标 -->
    <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAyNCIgaGVpZ2h0PSIxMDI0IiB2aWV3Qm94PSIwIDAgMTAyNCAxMDI0IiBmaWxsPSJub25lIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPgo8cmVjdCB3aWR0aD0iMTAyNCIgaGVpZ2h0PSIxMDI0IiByeD0iMjI0IiBmaWxsPSIjMDAwMDAwIi8+CjxwYXRoIGQ9Ik01MTIgMzIwQzQwNi4wIDMyMCAzMjAgNDA2LjAgMzIwIDUxMkMzMjAgNjE4LjAgNDA2LjAgNzA0IDUxMiA3MDRDNjE4LjAgNzA0IDcwNCA2MTguMCA3MDQgNTEyQzcwNCA0MDYuMCA2MTguMCAzMjAgNTEyIDMyMFoiIGZpbGw9IiNmZmYiIG9wYWNpdHk9IjAuOCIvPgo8L3N2Zz4=">
    <title>iOS26 AI Chat</title>
    <style>
        /* iOS 设计系统核心变量 */
        :root {
            --system-background: #f2f2f7;
            --secondary-background: #ffffff;
            --tertiary-background: rgba(255, 255, 255, 0.7);
            --primary-accent: #007aff;
            --secondary-accent: #34c759;
            --destructive-accent: #ff3b30;
            --primary-text: #000000;
            --secondary-text: #666666;
            --tertiary-text: #999999;
            --separator-color: #c6c6c8;
            --blur-effect: blur(20px);
            --corner-radius-large: 20px;
            --corner-radius-medium: 16px;
            --corner-radius-small: 12px;
            --shadow-light: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-medium: 0 6px 30px rgba(0, 0, 0, 0.12);
        }

        /* 深色模式适配 */
        @media (prefers-color-scheme: dark) {
            :root {
                --system-background: #000000;
                --secondary-background: #1c1c1e;
                --tertiary-background: rgba(30, 30, 30, 0.7);
                --primary-text: #ffffff;
                --secondary-text: #98989f;
                --tertiary-text: #636366;
                --separator-color: #38383a;
            }
        }

        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            background-color: var(--system-background);
            color: var(--primary-text);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 主应用容器 */
        #app-container {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            opacity: 1;
        }

        /* 顶部导航栏 */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top));
            background: var(--tertiary-background);
            -webkit-backdrop-filter: var(--blur-effect);
            backdrop-filter: var(--blur-effect);
            border-bottom: 1px solid var(--separator-color);
            z-index: 100;
        }

        .navbar-title {
            font-size: 17px;
            font-weight: 600;
        }

        .icon-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--secondary-background);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-button:active {
            transform: scale(0.92);
            background-color: var(--separator-color);
        }

        .icon-button svg {
            width: 20px;
            height: 20px;
            stroke: var(--primary-text);
            stroke-width: 2;
            fill: none;
        }

        /* 聊天消息区域 */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            display: none;
        }

        .message-wrapper {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .message-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 4px;
        }

        .message-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            font-size: 12px;
            font-weight: 600;
        }

        .user-avatar {
            background-color: var(--primary-accent);
            color: white;
        }

        .ai-avatar {
            background-color: var(--secondary-accent);
            color: white;
        }

        .message-name {
            font-size: 15px;
            font-weight: 500;
            color: var(--secondary-text);
        }

        .message-bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: var(--corner-radius-medium);
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 16px;
        }

        .user-message {
            align-self: flex-end;
        }

        .user-message .message-bubble {
            background-color: var(--primary-accent);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            align-self: flex-start;
        }

        .ai-message .message-bubble {
            background-color: var(--secondary-background);
            border-bottom-left-radius: 4px;
        }

        .message-bubble p {
            margin-bottom: 8px;
        }

        .message-bubble p:last-child {
            margin-bottom: 0;
        }

        .message-bubble code {
            background-color: rgba(0, 0, 0, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', monospace;
            font-size: 0.9em;
        }

        .loading-dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--secondary-text);
            animation: dot-bounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes dot-bounce {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.6;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 底部输入区域 */
        .input-container {
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: var(--tertiary-background);
            -webkit-backdrop-filter: var(--blur-effect);
            backdrop-filter: var(--blur-effect);
            border-top: 1px solid var(--separator-color);
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background-color: var(--secondary-background);
            border-radius: var(--corner-radius-large);
            padding: 10px 16px;
            border: 1px solid var(--separator-color);
        }

        #message-input {
            flex: 1;
            max-height: 120px;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            font-family: inherit;
            color: var(--primary-text);
            resize: none;
            line-height: 1.5;
            padding-top: 2px;
        }

        #send-button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--primary-accent);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        #send-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #send-button:active:not(:disabled) {
            transform: scale(0.92);
        }

        #send-button svg {
            width: 18px;
            height: 18px;
            stroke: white;
            stroke-width: 2;
            fill: none;
            margin-left: 2px;
        }

        /* 设置面板 */
        #settings-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9000;
            background-color: rgba(0, 0, 0, 0.3);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: fade-in 0.2s ease;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .settings-card {
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            background-color: var(--secondary-background);
            border-radius: var(--corner-radius-large);
            box-shadow: var(--shadow-medium);
            overflow: hidden;
            animation: slide-up 0.3s ease;
        }

        @keyframes slide-up {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .settings-header {
            padding: 20px 16px;
            border-bottom: 1px solid var(--separator-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: var(--secondary-background);
            z-index: 10;
        }

        .settings-title {
            font-size: 20px;
            font-weight: 700;
        }

        .close-button {
            font-size: 17px;
            color: var(--primary-accent);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
        }

        .settings-content {
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 15px;
            font-weight: 500;
            color: var(--secondary-text);
        }

        .form-desc {
            font-size: 13px;
            color: var(--tertiary-text);
            margin-top: -4px;
            line-height: 1.4;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--corner-radius-small);
            background-color: var(--system-background);
            border: 1px solid var(--separator-color);
            font-size: 16px;
            font-family: inherit;
            color: var(--primary-text);
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--primary-accent);
        }

        .settings-footer {
            padding: 16px;
            border-top: 1px solid var(--separator-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: sticky;
            bottom: 0;
            background: var(--secondary-background);
            z-index: 10;
        }

        .footer-button-row {
            display: flex;
            gap: 12px;
        }

        .settings-button {
            flex: 1;
            padding: 14px;
            border-radius: var(--corner-radius-medium);
            font-size: 17px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .settings-button.primary {
            background-color: var(--primary-accent);
            color: white;
        }

        .settings-button.secondary {
            background-color: var(--system-background);
            color: var(--primary-text);
        }

        .settings-button.test {
            background-color: var(--secondary-accent);
            color: white;
            width: 100%;
        }

        .settings-button:active {
            transform: scale(0.98);
            opacity: 0.8;
        }

        .settings-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Toast 提示 */
        #toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 15px;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
            max-width: 80%;
            text-align: center;
        }

        #toast.show {
            opacity: 1;
        }

        /* 空状态 */
        .empty-state {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .empty-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-desc {
            font-size: 15px;
            color: var(--secondary-text);
            max-width: 300px;
            line-height: 1.5;
        }

        /* 工具类 */
        .hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .removed {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- 主应用容器 -->
    <div id="app-container">
        <!-- 顶部导航栏 -->
        <nav class="navbar">
            <div class="navbar-title">AI Chat</div>
            <button id="settings-button" class="icon-button">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </nav>

        <!-- 聊天消息区域 -->
        <div class="chat-messages" id="chat-messages">
            <div class="empty-state">
                <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <h2 class="empty-title">开始对话</h2>
                <p class="empty-desc">输入你的问题，AI将为你提供解答</p>
            </div>
        </div>

        <!-- 底部输入区域 -->
        <div class="input-container">
            <div class="input-wrapper">
                <textarea id="message-input" placeholder="输入消息..." rows="1"></textarea>
                <button id="send-button" disabled>
                    <svg viewBox="0 0 24 24">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- 设置面板 -->
    <div id="settings-panel">
        <div class="settings-card">
            <div class="settings-header">
                <h2 class="settings-title">API 配置</h2>
                <button id="settings-close-button" class="close-button">取消</button>
            </div>
            <div class="settings-content">
                <div class="form-group">
                    <label class="form-label">接口地址 (HTTPS)</label>
                    <input type="url" id="api-base-input" class="form-input" placeholder="https://gateway.ai.cloudflare.com/v1/账户ID/网关名/openai" required>
                    <p class="form-desc">示例：https://xxx.workers.dev/v1 ，不要加结尾的/chat/completions</p>
                </div>
                <div class="form-group">
                    <label class="form-label">API Key</label>
                    <input type="password" id="api-key-input" class="form-input" placeholder="Cloudflare Workers AI 令牌" required>
                    <p class="form-desc">请使用Cloudflare生成的Workers AI专属令牌，不要用全局密钥</p>
                </div>
                <div class="form-group">
                    <label class="form-label">Model ID</label>
                    <input type="text" id="model-id-input" class="form-input" placeholder="@cf/meta/llama-3.1-8b-instruct" required>
                    <p class="form-desc">示例：@cf/qwen/qwen1.5-14b-chat-awq ，必须是Cloudflare支持的模型ID</p>
                </div>
            </div>
            <div class="settings-footer">
                <button id="settings-test-button" class="settings-button test">测试配置是否可用</button>
                <div class="footer-button-row">
                    <button id="settings-reset-button" class="settings-button secondary">重置</button>
                    <button id="settings-save-button" class="settings-button primary">保存配置</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast"></div>

    <script>
        // 常量定义
        const STORAGE_KEYS = {
            AI_CONFIG: 'ios26_ai_config'
        };
        let aiConfig = {};
        let messageList = [];
        let isGenerating = false;

        // DOM 元素获取
        const elements = {
            appContainer: document.getElementById('app-container'),
            chatMessages: document.getElementById('chat-messages'),
            messageInput: document.getElementById('message-input'),
            sendButton: document.getElementById('send-button'),
            settingsButton: document.getElementById('settings-button'),
            settingsPanel: document.getElementById('settings-panel'),
            settingsCloseButton: document.getElementById('settings-close-button'),
            settingsSaveButton: document.getElementById('settings-save-button'),
            settingsResetButton: document.getElementById('settings-reset-button'),
            settingsTestButton: document.getElementById('settings-test-button'),
            apiBaseInput: document.getElementById('api-base-input'),
            apiKeyInput: document.getElementById('api-key-input'),
            modelIdInput: document.getElementById('model-id-input'),
            toast: document.getElementById('toast')
        };

        // 工具函数
        const utils = {
            // Toast 提示
            showToast(message, duration = 2000) {
                elements.toast.textContent = message;
                elements.toast.classList.add('show');
                setTimeout(() => {
                    elements.toast.classList.remove('show');
                }, duration);
            },
            // 滚动到消息底部
            scrollToBottom() {
                elements.chatMessages.scrollTop = elements.chatMessages.scrollHeight;
            },
            // 自动调整输入框高度
            autoResizeTextarea() {
                elements.messageInput.style.height = 'auto';
                elements.messageInput.style.height = Math.min(elements.messageInput.scrollHeight, 120) + 'px';
            },
            // 转义HTML防止XSS
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },
            // 接口地址格式化（核心容错：自动修正用户填错的地址）
            formatApiBaseUrl(url) {
                if (!url) return '';
                let formatted = url.trim();
                formatted = formatted.replace(/\/chat\/completions\/?$/, '');
                formatted = formatted.replace(/\/+$/, '');
                return formatted;
            },
            // 提取详细错误信息
            async getDetailedError(error, response) {
                let errorInfo = {
                    message: '未知错误',
                    details: '',
                    status: null
                };

                if (error.name === 'TypeError' && error.message.includes('fetch')) {
                    errorInfo.message = '网络请求失败';
                    errorInfo.details = '可能是CORS跨域限制、网络不通、接口地址错误，请检查接口地址和Worker跨域配置';
                    return errorInfo;
                }

                if (response) {
                    errorInfo.status = response.status;
                    errorInfo.message = `请求失败，状态码：${response.status}`;
                    
                    try {
                        const errorData = await response.json();
                        errorInfo.details = errorData.error?.message || JSON.stringify(errorData);
                    } catch (e) {
                        try {
                            const textError = await response.text();
                            errorInfo.details = textError || '接口返回了非标准错误内容';
                        } catch (e2) {
                            errorInfo.details = '无法读取接口返回的错误信息';
                        }
                    }

                    if (response.status === 401) {
                        errorInfo.message = 'API密钥无效或无权限';
                        errorInfo.details += '\n请检查API Key是否正确，是否开通了Workers AI权限';
                    } else if (response.status === 404) {
                        errorInfo.message = '接口地址不存在';
                        errorInfo.details += '\n请检查接口地址是否正确，是否填错了路径';
                    } else if (response.status === 429) {
                        errorInfo.message = '请求频率超限或额度用完';
                        errorInfo.details += '\n请检查Cloudflare Workers AI免费额度是否用完';
                    } else if (response.status >= 500) {
                        errorInfo.message = '服务器内部错误';
                        errorInfo.details += '\nCloudflare服务异常，或你的Worker代码有错误';
                    }
                } else {
                    errorInfo.message = error.message || '未知错误';
                    errorInfo.details = error.stack || '无详细错误信息';
                }

                return errorInfo;
            }
        };

        // AI 配置相关逻辑
        const aiConfigManager = {
            // 加载配置
            loadConfig() {
                try {
                    const stored = localStorage.getItem(STORAGE_KEYS.AI_CONFIG);
                    if (stored) {
                        aiConfig = JSON.parse(stored);
                        this.fillConfigToForm();
                        return true;
                    }
                    return false;
                } catch (e) {
                    console.error('加载配置失败', e);
                    return false;
                }
            },
            // 填充配置到表单
            fillConfigToForm() {
                elements.apiBaseInput.value = aiConfig.apiBase || '';
                elements.apiKeyInput.value = aiConfig.apiKey || '';
                elements.modelIdInput.value = aiConfig.modelId || '';
            },
            // 从表单获取并格式化配置
            getFormattedConfig() {
                const apiBase = utils.formatApiBaseUrl(elements.apiBaseInput.value);
                const apiKey = elements.apiKeyInput.value.trim();
                const modelId = elements.modelIdInput.value.trim();
                return { apiBase, apiKey, modelId };
            },
            // 保存配置
            saveConfig() {
                const { apiBase, apiKey, modelId } = this.getFormattedConfig();

                if (!apiBase || !apiKey || !modelId) {
                    utils.showToast('请填写完整的配置信息');
                    return false;
                }

                if (!apiBase.startsWith('https://')) {
                    alert('接口地址错误：必须使用HTTPS协议，http地址无法使用');
                    return false;
                }

                aiConfig = { apiBase, apiKey, modelId };
                localStorage.setItem(STORAGE_KEYS.AI_CONFIG, JSON.stringify(aiConfig));
                utils.showToast('配置保存成功');
                return true;
            },
            // 重置配置
            resetConfig() {
                elements.apiBaseInput.value = '';
                elements.apiKeyInput.value = '';
                elements.modelIdInput.value = '';
                utils.showToast('配置已重置');
            },
            // 检查配置是否有效
            isConfigValid() {
                return aiConfig.apiBase && aiConfig.apiKey && aiConfig.modelId;
            },
            // 测试配置是否可用
            async testConfig() {
                const { apiBase, apiKey, modelId } = this.getFormattedConfig();
                
                if (!apiBase || !apiKey || !modelId) {
                    alert('请先填写完整的配置信息，再进行测试');
                    return;
                }

                if (!apiBase.startsWith('https://')) {
                    alert('接口地址错误：必须使用HTTPS协议');
                    return;
                }

                elements.settingsTestButton.disabled = true;
                elements.settingsTestButton.textContent = '测试中...';

                try {
                    const testRequestBody = {
                        model: modelId,
                        messages: [{ role: 'user', content: 'hi' }],
                        stream: false,
                        max_tokens: 10
                    };

                    const response = await fetch(`${apiBase}/chat/completions`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify(testRequestBody),
                        signal: AbortSignal.timeout(15000)
                    });

                    if (!response.ok) {
                        const errorInfo = await utils.getDetailedError(null, response);
                        throw new Error(`${errorInfo.message}\n详细信息：${errorInfo.details}`);
                    }

                    const data = await response.json();
                    if (!data.choices || !data.choices[0]) {
                        throw new Error('接口返回格式不符合OpenAI规范，无法正常使用');
                    }

                    alert('✅ 配置测试成功！接口、密钥、模型均正常可用，可以开始聊天了');
                    this.saveConfig();

                } catch (error) {
                    console.error('配置测试失败', error);
                    alert(`❌ 配置测试失败：\n${error.message}`);
                } finally {
                    elements.settingsTestButton.disabled = false;
                    elements.settingsTestButton.textContent = '测试配置是否可用';
                }
            }
        };

        // 聊天相关逻辑
        const chatManager = {
            // 渲染单条消息
            renderMessage(message, isNew = false) {
                const { role, content } = message;
                const isUser = role === 'user';

                if (messageList.length <= 1) {
                    elements.chatMessages.innerHTML = '';
                }

                const messageWrapper = document.createElement('div');
                messageWrapper.className = `message-wrapper ${isUser ? 'user-message' : 'ai-message'}`;
                messageWrapper.dataset.id = message.id;

                const headerHtml = `
                    <div class="message-header">
                        <div class="message-avatar ${isUser ? 'user-avatar' : 'ai-avatar'}">
                            ${isUser ? '你' : 'AI'}
                        </div>
                        <span class="message-name">${isUser ? '你' : 'AI 助手'}</span>
                    </div>
                `;

                const contentHtml = `
                    <div class="message-bubble">
                        ${isUser ? utils.escapeHtml(content) : ''}
                    </div>
                `;

                messageWrapper.innerHTML = headerHtml + contentHtml;
                elements.chatMessages.appendChild(messageWrapper);

                if (!isUser && isNew) {
                    return messageWrapper.querySelector('.message-bubble');
                }

                utils.scrollToBottom();
            },
            // 渲染空状态
            renderEmptyState() {
                elements.chatMessages.innerHTML = `
                    <div class="empty-state">
                        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <h2 class="empty-title">开始对话</h2>
                        <p class="empty-desc">输入你的问题，AI将为你提供解答</p>
                    </div>
                `;
            },
            // 发送消息
            async sendMessage(content) {
                if (!content.trim() || isGenerating) return;
                if (!aiConfigManager.isConfigValid()) {
                    utils.showToast('请先完成并保存API配置');
                    openSettings();
                    return;
                }

                elements.messageInput.value = '';
                utils.autoResizeTextarea();
                elements.sendButton.disabled = true;

                const userMessage = {
                    id: Date.now().toString(),
                    role: 'user',
                    content: content.trim()
                };
                messageList.push(userMessage);
                this.renderMessage(userMessage);

                const aiMessageId = (Date.now() + 1).toString();
                let aiMessageContent = '';
                let aiBubbleElement = null;

                isGenerating = true;

                try {
                    const requestBody = {
                        model: aiConfig.modelId,
                        messages: messageList.map(msg => ({ role: msg.role, content: msg.content })),
                        stream: true,
                        temperature: 0.7
                    };

                    const response = await fetch(`${aiConfig.apiBase}/chat/completions`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${aiConfig.apiKey}`
                        },
                        body: JSON.stringify(requestBody)
                    });

                    if (!response.ok) {
                        const errorInfo = await utils.getDetailedError(null, response);
                        throw new Error(`${errorInfo.message}\n${errorInfo.details}`);
                    }

                    const aiMessage = {
                        id: aiMessageId,
                        role: 'assistant',
                        content: ''
                    };
                    messageList.push(aiMessage);
                    aiBubbleElement = this.renderMessage(aiMessage, true);
                    aiBubbleElement.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';

                        for (const line of lines) {
                            const trimmedLine = line.trim();
                            if (!trimmedLine || !trimmedLine.startsWith('data: ')) continue;
                            if (trimmedLine === 'data: [DONE]') continue;
                            
                            try {
                                const jsonData = JSON.parse(trimmedLine.slice(5));
                                const delta = jsonData.choices?.[0]?.delta?.content;
                                if (delta) {
                                    aiMessageContent += delta;
                                    aiBubbleElement.innerHTML = utils.escapeHtml(aiMessageContent).replace(/\n/g, '<br>');
                                    utils.scrollToBottom();
                                }
                            } catch (e) {
                                console.warn('流式数据解析失败，跳过该行', e, trimmedLine);
                                continue;
                            }
                        }
                    }

                    const finalAiMessage = messageList.find(msg => msg.id === aiMessageId);
                    if (finalAiMessage) {
                        finalAiMessage.content = aiMessageContent;
                    }

                } catch (error) {
                    console.error('发送消息失败', error);
                    const errorFullMessage = error.message || '未知错误';
                    utils.showToast('请求失败，查看详细错误信息');
                    
                    if (aiBubbleElement) {
                        aiBubbleElement.innerHTML = `❌ 请求失败\n${errorFullMessage}`;
                    } else {
                        const errorMessage = {
                            id: aiMessageId,
                            role: 'assistant',
                            content: `❌ 请求失败\n${errorFullMessage}`
                        };
                        messageList.push(errorMessage);
                        this.renderMessage(errorMessage);
                    }

                } finally {
                    isGenerating = false;
                    elements.sendButton.disabled = elements.messageInput.value.trim() === '';
                }
            }
        };

        // 界面控制函数
        function openSettings() {
            elements.settingsPanel.style.display = 'flex';
            aiConfigManager.fillConfigToForm();
        }

        function closeSettings() {
            elements.settingsPanel.style.display = 'none';
        }

        // 事件监听
        function initEventListeners() {
            // 输入框相关事件
            elements.messageInput.addEventListener('input', () => {
                utils.autoResizeTextarea();
                elements.sendButton.disabled = elements.messageInput.value.trim() === '' || isGenerating;
            });

            elements.messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    const content = elements.messageInput.value;
                    if (content.trim() && !isGenerating) {
                        chatManager.sendMessage(content);
                    }
                }
            });

            // 发送按钮事件
            elements.sendButton.addEventListener('click', () => {
                const content = elements.messageInput.value;
                if (content.trim() && !isGenerating) {
                    chatManager.sendMessage(content);
                }
            });

            // 设置相关事件
            elements.settingsButton.addEventListener('click', openSettings);
            elements.settingsCloseButton.addEventListener('click', closeSettings);
            elements.settingsPanel.addEventListener('click', (e) => {
                if (e.target === elements.settingsPanel) {
                    closeSettings();
                }
            });

            elements.settingsSaveButton.addEventListener('click', () => {
                const success = aiConfigManager.saveConfig();
                if (success) {
                    closeSettings();
                }
            });

            elements.settingsResetButton.addEventListener('click', aiConfigManager.resetConfig);
            elements.settingsTestButton.addEventListener('click', aiConfigManager.testConfig);
        }

        // 初始化函数
        function init() {
            aiConfigManager.loadConfig();
            initEventListeners();
            chatManager.renderEmptyState();
            
            // 首次打开无配置，自动打开设置面板
            if (!aiConfigManager.isConfigValid()) {
                setTimeout(() => {
                    utils.showToast('请先配置API信息', 3000);
                    openSettings();
                }, 500);
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

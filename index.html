    <title>iOS26 AI Chat</title>
    <style>
        /* iOS 设计系统核心变量 */
        :root {
            --system-background: #f2f2f7;
            --secondary-background: #ffffff;
            --tertiary-background: rgba(255, 255, 255, 0.7);
            --primary-accent: #007aff;
            --secondary-accent: #34c759;
            --destructive-accent: #ff3b30;
            --primary-text: #000000;
            --secondary-text: #666666;
            --tertiary-text: #999999;
            --separator-color: #c6c6c8;
            --blur-effect: blur(20px);
            --corner-radius-large: 20px;
            --corner-radius-medium: 16px;
            --corner-radius-small: 12px;
            --shadow-light: 0 4px 20px rgba(0, 0, 0, 0.08);
            --shadow-medium: 0 6px 30px rgba(0, 0, 0, 0.12);
        }

        /* 深色模式适配 */
        @media (prefers-color-scheme: dark) {
            :root {
                --system-background: #000000;
                --secondary-background: #1c1c1e;
                --tertiary-background: rgba(30, 30, 30, 0.7);
                --primary-text: #ffffff;
                --secondary-text: #98989f;
                --tertiary-text: #636366;
                --separator-color: #38383a;
            }
        }

        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            background-color: var(--system-background);
            color: var(--primary-text);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 锁屏认证层 */
        #lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background-color: var(--system-background);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease, transform 0.4s ease;
            padding: 24px;
        }

        .lock-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--primary-accent), #5856d6);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .lock-icon svg {
            width: 40px;
            height: 40px;
            stroke: white;
            stroke-width: 2;
            fill: none;
        }

        .lock-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        .lock-desc {
            font-size: 17px;
            color: var(--secondary-text);
            margin-bottom: 48px;
            text-align: center;
            max-width: 300px;
        }

        .auth-button {
            background-color: var(--primary-accent);
            color: white;
            border: none;
            border-radius: var(--corner-radius-medium);
            padding: 16px 32px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-light);
        }

        .auth-button:active {
            transform: scale(0.96);
            opacity: 0.8;
        }

        .auth-button.secondary {
            background-color: var(--secondary-background);
            color: var(--primary-accent);
            margin-top: 16px;
        }

        /* 主应用容器 */
        #app-container {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        /* 顶部导航栏 */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top));
            background: var(--tertiary-background);
            -webkit-backdrop-filter: var(--blur-effect);
            backdrop-filter: var(--blur-effect);
            border-bottom: 1px solid var(--separator-color);
            z-index: 100;
        }

        .navbar-title {
            font-size: 17px;
            font-weight: 600;
        }

        .icon-button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--secondary-background);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-button:active {
            transform: scale(0.92);
            background-color: var(--separator-color);
        }

        .icon-button svg {
            width: 20px;
            height: 20px;
            stroke: var(--primary-text);
            stroke-width: 2;
            fill: none;
        }

        /* 聊天消息区域 */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            display: none;
        }

        .message-wrapper {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .message-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 4px;
        }

        .message-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            font-size: 12px;
            font-weight: 600;
        }

        .user-avatar {
            background-color: var(--primary-accent);
            color: white;
        }

        .ai-avatar {
            background-color: var(--secondary-accent);
            color: white;
        }

        .message-name {
            font-size: 15px;
            font-weight: 500;
            color: var(--secondary-text);
        }

        .message-bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: var(--corner-radius-medium);
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 16px;
        }

        .user-message {
            align-self: flex-end;
        }

        .user-message .message-bubble {
            background-color: var(--primary-accent);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            align-self: flex-start;
        }

        .ai-message .message-bubble {
            background-color: var(--secondary-background);
            border-bottom-left-radius: 4px;
        }

        .message-bubble p {
            margin-bottom: 8px;
        }

        .message-bubble p:last-child {
            margin-bottom: 0;
        }

        .message-bubble code {
            background-color: rgba(0, 0, 0, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', monospace;
            font-size: 0.9em;
        }

        .loading-dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--secondary-text);
            animation: dot-bounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes dot-bounce {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.6;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 底部输入区域 */
        .input-container {
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: var(--tertiary-background);
            -webkit-backdrop-filter: var(--blur-effect);
            backdrop-filter: var(--blur-effect);
            border-top: 1px solid var(--separator-color);
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background-color: var(--secondary-background);
            border-radius: var(--corner-radius-large);
            padding: 10px 16px;
            border: 1px solid var(--separator-color);
        }

        #message-input {
            flex: 1;
            max-height: 120px;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            font-family: inherit;
            color: var(--primary-text);
            resize: none;
            line-height: 1.5;
            padding-top: 2px;
        }

        #send-button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--primary-accent);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        #send-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #send-button:active:not(:disabled) {
            transform: scale(0.92);
        }

        #send-button svg {
            width: 18px;
            height: 18px;
            stroke: white;
            stroke-width: 2;
            fill: none;
            margin-left: 2px;
        }

        /* 设置面板 */
        #settings-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9000;
            background-color: rgba(0, 0, 0, 0.3);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: fade-in 0.2s ease;
        }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .settings-card {
            width: 100%;
            max-width: 480px;
            max-height: 90vh;
            overflow-y: auto;
            background-color: var(--secondary-background);
            border-radius: var(--corner-radius-large);
            box-shadow: var(--shadow-medium);
            overflow: hidden;
            animation: slide-up 0.3s ease;
        }

        @keyframes slide-up {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .settings-header {
            padding: 20px 16px;
            border-bottom: 1px solid var(--separator-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: var(--secondary-background);
            z-index: 10;
        }

        .settings-title {
            font-size: 20px;
            font-weight: 700;
        }

        .close-button {
            font-size: 17px;
            color: var(--primary-accent);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
        }

        .settings-content {
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 15px;
            font-weight: 500;
            color: var(--secondary-text);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--corner-radius-small);
            background-color: var(--system-background);
            border: 1px solid var(--separator-color);
            font-size: 16px;
            font-family: inherit;
            color: var(--primary-text);
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--primary-accent);
        }

        .form-tip {
            font-size: 13px;
            color: var(--tertiary-text);
            line-height: 1.4;
        }

        .settings-footer {
            padding: 16px;
            border-top: 1px solid var(--separator-color);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            position: sticky;
            bottom: 0;
            background: var(--secondary-background);
            z-index: 10;
        }

        .settings-button {
            flex: 1;
            min-width: 100px;
            padding: 14px 8px;
            border-radius: var(--corner-radius-medium);
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .settings-button.primary {
            background-color: var(--primary-accent);
            color: white;
        }

        .settings-button.secondary {
            background-color: var(--system-background);
            color: var(--primary-text);
        }

        .settings-button.success {
            background-color: var(--secondary-accent);
            color: white;
        }

        .settings-button:active {
            transform: scale(0.98);
            opacity: 0.8;
        }

        .settings-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Toast 提示 */
        #toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 15px;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
            max-width: 80%;
            text-align: center;
        }

        #toast.show {
            opacity: 1;
        }

        /* 空状态 */
        .empty-state {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        .empty-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-desc {
            font-size: 15px;
            color: var(--secondary-text);
            max-width: 300px;
            line-height: 1.5;
        }

        /* 工具类 */
        .hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .removed {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- 锁屏认证层 -->

    <!-- 主应用容器 -->
    <div id="app-container">
        <!-- 顶部导航栏 -->
        <nav class="navbar">
            <div class="navbar-title">AI Chat</div>
            <button id="settings-button" class="icon-button">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>

        <!-- 聊天消息区域 -->

                </svg>

                    <svg viewBox="0 0 24 24">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- 设置面板 -->
    <div id="settings-panel">
        <div class="settings-card">
            <div class="settings-header">
                <h2 class="settings-title">API 配置</h2>
                <button id="settings-close-button" class="close-button">取消</button>
            </div>
            <div class="settings-content">
                <div class="form-group">
                    <label class="form-label">接口地址 (HTTPS)</label>
                    <input type="url" id="api-base-input" class="form-input" placeholder="https://xxx.workers.dev/v1" required>
                    <p class="form-tip">示例：https://gateway.ai.cloudflare.com/v1/你的账户ID/网关名/openai</p>
                </div>

                    <label class="form-label">API Key</label>
                    <input type="password" id="api-key-input" class="form-input" placeholder="你的Cloudflare Workers AI令牌" required>
                    <p class="form-tip">请使用「Workers AI 编辑」模板生成的专属令牌，不要用全局API Key</p>
                </div>
                <div class="form-group">
                    <label class="form-label">Model ID</label>
                    <input type="text" id="model-id-input" class="form-input" placeholder="@cf/meta/llama-3.1-8b-instruct" required>
                    <p class="form-tip">示例：@cf/meta/llama-3.1-8b-instruct、@cf/qwen/qwen1.5-14b-chat-awq</p>

                <button id="settings-reset-button" class="settings-button secondary">重置</button>

    <!-- Toast 提示 -->
    <div id="toast"></div>

    <script>
        // 常量定义
        const STORAGE_KEYS = {
            AUTH_CREDENTIAL: 'ios26_faceid_credential',
            AI_CONFIG: 'ios26_ai_config'
        };
        let isAuthenticated = false;
        let aiConfig = {};
        let messageList = [];
        let isGenerating = false;

        // DOM 元素获取
        const elements = {
            lockScreen: document.getElementById('lock-screen'),
            authUnlockButton: document.getElementById('auth-unlock-button'),
            authRegisterButton: document.getElementById('auth-register-button'),
            appContainer: document.getElementById('app-container'),
            chatMessages: document.getElementById('chat-messages'),
            messageInput: document.getElementById('message-input'),
            sendButton: document.getElementById('send-button'),
            settingsButton: document.getElementById('settings-button'),
            settingsPanel: document.getElementById('settings-panel'),
            settingsCloseButton: document.getElementById('settings-close-button'),
            settingsSaveButton: document.getElementById('settings-save-button'),
            settingsResetButton: document.getElementById('settings-reset-button'),
            settingsTestButton: document.getElementById('settings-test-button'),
            apiBaseInput: document.getElementById('api-base-input'),
            apiKeyInput: document.getElementById('api-key-input'),
            modelIdInput: document.getElementById('model-id-input'),
            toast: document.getElementById('toast')
        };

        // 工具函数
        const utils = {
            // Base64URL 与 ArrayBuffer 转换（WebAuthn 必需）
            base64urlToArrayBuffer(base64url) {
                const base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
                const padLength = (4 - (base64.length % 4)) % 4;
                const padded = base64.padEnd(base64.length + padLength, '=');
                const binary = atob(padded);
                const buffer = new ArrayBuffer(binary.length);
                const view = new Uint8Array(buffer);
                for (let i = 0; i < binary.length; i++) {
                    view[i] = binary.charCodeAt(i);
                }
                return buffer;
            },
            arrayBufferToBase64url(buffer) {
                const bytes = new Uint8Array(buffer);
                let binary = '';
                for (let i = 0; i < bytes.byteLength; i++) {
                    binary += String.fromCharCode(bytes[i]);
                }
                const base64 = btoa(binary);
                return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
            },
            // Toast 提示
            showToast(message, duration = 2000) {
                elements.toast.textContent = message;
                elements.toast.classList.add('show');
                setTimeout(() => {
                    elements.toast.classList.remove('show');
                }, duration);
            },
            // 滚动到消息底部
            scrollToBottom() {
                elements.chatMessages.scrollTop = elements.chatMessages.scrollHeight;
            },
            // 自动调整输入框高度
            autoResizeTextarea() {
                elements.messageInput.style.height = 'auto';
                elements.messageInput.style.height = Math.min(elements.messageInput.scrollHeight, 120) + 'px';
            },
            // 转义HTML防止XSS
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },
            // 智能修正接口地址
            fixApiBaseUrl(url) {
                if (!url) return '';
                // 去掉末尾多余的斜杠
                let fixedUrl = url.trim().replace(/\/+$/, '');
                // 去掉用户误加的/chat/completions结尾
                fixedUrl = fixedUrl.replace(/\/chat\/completions$/, '');
                return fixedUrl;
            },
            // 格式化错误详情，给用户看明白
            formatErrorDetail(error, response) {
                let detail = '';
                if (error.name === 'TypeError' && error.message.includes('Failed to fetch')) {
                    detail = '【错误类型】网络连接失败/CORS跨域拦截\n\n【解决方法】\n1. 请确认接口地址能正常访问\n2. 推荐使用Cloudflare官方AI网关，自动解决跨域问题\n3. 检查手机网络，关闭VPN/代理';
                } else if (response) {
                    detail += `【HTTP状态码】${response.status} ${response.statusText}\n\n`;
                    if (response.status === 401) {
                        detail += '【错误原因】API Key无效/权限不足\n\n【解决方法】\n1. 请使用「Workers AI 编辑」模板生成专属令牌\n2. 确认令牌没有过期，账户权限正常\n3. 检查API Key前后没有多余空格';
                    } else if (response.status === 404) {
                        detail += '【错误原因】接口地址不存在/模型ID错误\n\n【解决方法】\n1. 核对接口地址格式是否正确，不要填错路径\n2. 确认模型ID是Cloudflare官方支持的模型\n3. 检查接口地址是否能正常访问';
                    } else if (response.status === 429) {
                        detail += '【错误原因】请求频率超限/免费额度用完\n\n【解决方法】\n1. Cloudflare免费计划有每日额度限制，请等待额度恢复\n2. 降低发送消息的频率';
                    } else if (response.status >= 500) {
                        detail += '【错误原因】服务器内部错误\n\n【解决方法】\n1. 确认Cloudflare服务正常\n2. 检查你的Worker代码是否有报错\n3. 稍后再试';
                    }
                } else {
                    detail += `【错误信息】${error.message || error}\n\n`;
                }
                return detail;
            }
        };

        // Face ID 认证相关逻辑
        const faceIdAuth = {
            // 检查是否已注册凭证
            getStoredCredential() {
                try {
                    const stored = localStorage.getItem(STORAGE_KEYS.AUTH_CREDENTIAL);
                    return stored ? JSON.parse(stored) : null;
                } catch (e) {
                    console.error('获取凭证失败', e);
                    return null;
                }
            },
            // 注册Face ID凭证
            async register() {
                try {
                    const challenge = crypto.getRandomValues(new Uint8Array(32));
                    const userId = crypto.getRandomValues(new Uint8Array(16));

                    const publicKeyOptions = {
                        challenge: challenge,
                        rp: {
                            name: 'iOS26 AI Chat',
                            id: window.location.hostname
                        },
                        user: {
                            id: userId,
                            name: 'User',
                            displayName: 'iOS26 User'
                        },
                        pubKeyCredParams: [
                            { type: 'public-key', alg: -7 },
                            { type: 'public-key', alg: -257 }
                        ],
                        authenticatorSelection: {
                            authenticatorAttachment: 'platform',
                            userVerification: 'required',
                            requireResidentKey: false
                        },
                        timeout: 60000,
                        attestation: 'none'
                    };

                    const credential = await navigator.credentials.create({
                        publicKey: publicKeyOptions
                    });

                    // 存储凭证信息
                    const credentialData = {
                        id: credential.id,
                        rawId: utils.arrayBufferToBase64url(credential.rawId),
                        type: credential.type,
                        transports: credential.response.getTransports?.() || []
                    };

                    localStorage.setItem(STORAGE_KEYS.AUTH_CREDENTIAL, JSON.stringify(credentialData));
                    utils.showToast('Face ID 注册成功');
                    return true;

                } catch (error) {
                    console.error('Face ID 注册失败', error);
                    alert(`Face ID 注册失败\n\n原因：${error.message || '请重试，确保在HTTPS环境下使用'}`);
                    return false;
                }
            },
            // 验证Face ID
            async authenticate() {
                const storedCredential = this.getStoredCredential();
                if (!storedCredential) {
                    alert('未找到Face ID凭证，请先注册');
                    return false;
                }

                try {
                    const challenge = crypto.getRandomValues(new Uint8Array(32));
                    const publicKeyOptions = {
                        challenge: challenge,
                        allowCredentials: [
                            {
                                type: 'public-key',
                                id: utils.base64urlToArrayBuffer(storedCredential.rawId),
                                transports: storedCredential.transports
                            }
                        ],
                        userVerification: 'required',
                        timeout: 60000
                    };

                    const assertion = await navigator.credentials.get({
                        publicKey: publicKeyOptions
                    });

                    return !!assertion;

                } catch (error) {
                    console.error('Face ID 认证失败', error);
                    alert(`Face ID 认证失败\n\n原因：${error.message || '请重试'}`);
                    return false;
                }
            },
            // 初始化认证状态
            initAuthState() {
                const hasCredential = !!this.getStoredCredential();
                if (hasCredential) {
                    elements.authUnlockButton.classList.remove('hidden');
                    elements.authRegisterButton.classList.add('hidden');
                } else {
                    elements.authUnlockButton.classList.add('hidden');
                    elements.authRegisterButton.classList.remove('hidden');
                }
            }
        };

        // AI 配置相关逻辑
        const aiConfigManager = {
            // 加载配置
            loadConfig() {
                try {
                    const stored = localStorage.getItem(STORAGE_KEYS.AI_CONFIG);
                    if (stored) {
                        aiConfig = JSON.parse(stored);
                        this.fillConfigToForm();
                        return true;
                    }
                    return false;
                } catch (e) {
                    console.error('加载配置失败', e);
                    return false;
                }
            },
            // 填充配置到表单
            fillConfigToForm() {
                elements.apiBaseInput.value = aiConfig.apiBase || '';
                elements.apiKeyInput.value = aiConfig.apiKey || '';
                elements.modelIdInput.value = aiConfig.modelId || '';
            },
            // 从表单获取并修正配置
            getConfigFromForm() {
                const apiBase = utils.fixApiBaseUrl(elements.apiBaseInput.value);
                const apiKey = elements.apiKeyInput.value.trim();
                const modelId = elements.modelIdInput.value.trim();
                return { apiBase, apiKey, modelId };
            },
            // 保存配置
            saveConfig() {
                const { apiBase, apiKey, modelId } = this.getConfigFromForm();

                if (!apiBase || !apiKey || !modelId) {
                    utils.showToast('请填写完整的配置信息');
                    return false;
                }

                // 校验HTTPS
                if (!apiBase.startsWith('https://')) {
                    alert('配置错误\n\n接口地址必须使用HTTPS协议，http://地址无法使用');
                    return false;
                }

                aiConfig = { apiBase, apiKey, modelId };
                localStorage.setItem(STORAGE_KEYS.AI_CONFIG, JSON.stringify(aiConfig));
                utils.showToast('配置保存成功');
                return true;
            },
            // 重置配置
            resetConfig() {
                elements.apiBaseInput.value = '';
                elements.apiKeyInput.value = '';
                elements.modelIdInput.value = '';
            },
            // 检查配置是否有效
            isConfigValid() {
                return aiConfig.apiBase && aiConfig.apiKey && aiConfig.modelId;
            },
            // 测试配置是否可用
            async testConfig() {
                const { apiBase, apiKey, modelId } = this.getConfigFromForm();
                
                // 先校验必填项
                if (!apiBase || !apiKey || !modelId) {
                    alert('测试失败\n\n请先填写完整的接口地址、API Key、Model ID');
                    return;
                }
                if (!apiBase.startsWith('https://')) {
                    alert('测试失败\n\n接口地址必须使用HTTPS协议');
                    return;
                }

                // 更改按钮状态
                elements.settingsTestButton.disabled = true;
                elements.settingsTestButton.textContent = '测试中...';

                try {
                    // 发送测试请求
                    const testRequestBody = {
                        model: modelId,
                        messages: [{ role: 'user', content: 'hi' }],
                        stream: false,
                        max_tokens: 50
                    };

                    const response = await fetch(`${apiBase}/chat/completions`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify(testRequestBody)
                    });

                    // 处理非200响应
                    if (!response.ok) {
                        let errorDetail = '';
                        try {
                            const errorData = await response.json();
                            errorDetail = `接口返回错误：${JSON.stringify(errorData, null, 2)}`;
                        } catch (e) {
                            errorDetail = `接口返回内容：${await response.text()}`;
                        }
                        const formatError = utils.formatErrorDetail(new Error('配置测试失败'), response);
                        alert(`配置测试失败\n\n${formatError}\n\n【详细返回】\n${errorDetail}`);
                        return;
                    }

                    // 解析响应
                    const result = await response.json();
                    if (result.choices && result.choices.length > 0) {
                        alert('✅ 配置测试成功！\n\n接口、API Key、模型均正常，可保存配置开始使用');
                        elements.settingsTestButton.classList.remove('secondary');
                        elements.settingsTestButton.classList.add('success');
                        elements.settingsTestButton.textContent = '测试成功';
                    } else {
                        alert('⚠️ 接口响应异常\n\n接口返回成功，但没有正常的聊天内容，请检查模型ID是否正确');
                    }

                } catch (error) {
                    console.error('配置测试失败', error);
                    const formatError = utils.formatErrorDetail(error, null);
                    alert(`配置测试失败\n\n${formatError}`);
                } finally {
                    // 恢复按钮状态
                    elements.settingsTestButton.disabled = false;
                    if (elements.settingsTestButton.classList.contains('success')) {
                        setTimeout(() => {
                            elements.settingsTestButton.classList.remove('success');
                            elements.settingsTestButton.classList.add('secondary');
                            elements.settingsTestButton.textContent = '测试配置';
                        }, 2000);
                    } else {
                        elements.settingsTestButton.textContent = '测试配置';
                    }
                }
            }
        };

        // 聊天相关逻辑
        const chatManager = {
            // 渲染单条消息
            renderMessage(message, isNew = false) {
                const { role, content } = message;
                const isUser = role === 'user';

                // 清空空状态
                if (messageList.length <= 1) {
                    elements.chatMessages.innerHTML = '';
                }

                const messageWrapper = document.createElement('div');
                messageWrapper.className = `message-wrapper ${isUser ? 'user-message' : 'ai-message'}`;
                messageWrapper.dataset.id = message.id;

                const headerHtml = `
                    <div class="message-header">
                        <div class="message-avatar ${isUser ? 'user-avatar' : 'ai-avatar'}">
                            ${isUser ? '你' : 'AI'}
                        </div>
                        <span class="message-name">${isUser ? '你' : 'AI 助手'}</span>
                    </div>
                `;

                const contentHtml = `
                    <div class="message-bubble">
                        ${isUser ? utils.escapeHtml(content) : ''}
                    </div>
                `;

                messageWrapper.innerHTML = headerHtml + contentHtml;
                elements.chatMessages.appendChild(messageWrapper);

                // 如果是AI消息且是新消息，返回气泡元素用于流式更新
                if (!isUser && isNew) {
                    return messageWrapper.querySelector('.message-bubble');
                }

                utils.scrollToBottom();
            },
            // 渲染空状态
            renderEmptyState() {
                elements.chatMessages.innerHTML = `
                    <div class="empty-state">
                        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <h2 class="empty-title">开始对话</h2>
                        <p class="empty-desc">输入你的问题，AI将为你提供解答</p>
                    </div>
                `;
            },
            // 发送消息
            async sendMessage(content) {
                if (!content.trim() || isGenerating) return;
                if (!aiConfigManager.isConfigValid()) {
                    utils.showToast('请先完成并保存API配置');
                    openSettings();
                    return;
                }

                // 清空输入框
                elements.messageInput.value = '';
                utils.autoResizeTextarea();
                elements.sendButton.disabled = true;
                elements.messageInput.disabled = true;

                // 添加用户消息
                const userMessage = {
                    id: Date.now().toString(),
                    role: 'user',
                    content: content.trim()
                };
                messageList.push(userMessage);
                this.renderMessage(userMessage);

                // 生成AI消息ID
                const aiMessageId = (Date.now() + 1).toString();
                let aiMessageContent = '';
                let aiBubbleElement = null;

                // 标记生成中
                isGenerating = true;

                try {
                    // 构造请求体
                    const requestBody = {
                        model: aiConfig.modelId,
                        messages: messageList.map(msg => ({ role: msg.role, content: msg.content })),
                        stream: true,
                        temperature: 0.7
                    };

                    // 发起请求
                    const response = await fetch(`${aiConfig.apiBase}/chat/completions`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${aiConfig.apiKey}`
                        },
                        body: JSON.stringify(requestBody)
                    });

                    if (!response.ok) {
                        // 捕获非200错误，给出详细提示
                        let errorDetail = '';
                        try {
                            const errorData = await response.json();
                            errorDetail = `接口返回错误：${JSON.stringify(errorData, null, 2)}`;
                        } catch (e) {
                            errorDetail = `接口返回内容：${await response.text()}`;
                        }
                        const formatError = utils.formatErrorDetail(new Error('请求失败'), response);
                        throw new Error(`${formatError}\n\n【详细返回】\n${errorDetail}`);
                    }

                    // 处理流式响应
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    let buffer = '';

                    // 先渲染AI消息占位
                    const aiMessage = {
                        id: aiMessageId,
                        role: 'assistant',
                        content: ''
                    };
                    messageList.push(aiMessage);
                    aiBubbleElement = this.renderMessage(aiMessage, true);
                    aiBubbleElement.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop(); // 保留不完整的行

                        for (const line of lines) {
                            const trimmedLine = line.trim();
                            if (!trimmedLine || trimmedLine === 'data: [DONE]') continue;
                            if (trimmedLine.startsWith('data: ')) {
                                try {
                                    const jsonData = JSON.parse(trimmedLine.slice(5));
                                    const delta = jsonData.choices?.[0]?.delta?.content;
                                    if (delta) {
                                        aiMessageContent += delta;
                                        aiBubbleElement.innerHTML = utils.escapeHtml(aiMessageContent).replace(/\n/g, '<br>');
                                        utils.scrollToBottom();
                                    }
                                } catch (e) {
                                    // 忽略单条解析错误，不中断流式输出
                                    console.warn('流式数据解析失败', e, trimmedLine);
                                    continue;
                                }
                            }
                        }
                    }

                    // 更新最终消息内容
                    const finalAiMessage = messageList.find(msg => msg.id === aiMessageId);
                    if (finalAiMessage) {
                        finalAiMessage.content = aiMessageContent;
                    }

                } catch (error) {
                    console.error('发送消息失败', error);
                    // 弹出详细错误，方便用户排查
                    alert(`请求失败\n\n${error.message || '未知错误，请检查网络和配置'}`);

                    // 处理错误状态
                    if (aiBubbleElement) {
                        aiBubbleElement.innerHTML = `❌ 请求失败，请查看错误提示`;
                    } else {
                        // 如果还没渲染气泡，添加错误消息
                        const errorMessage = {
                            id: aiMessageId,
                            role: 'assistant',
                            content: `❌ 请求失败，请查看错误提示`
                        };
                        messageList.push(errorMessage);
                        this.renderMessage(errorMessage);
                    }

                } finally {
                    // 恢复状态
                    isGenerating = false;
                    elements.messageInput.disabled = false;
                    elements.sendButton.disabled = elements.messageInput.value.trim() === '';
                }
            },
            // 清空聊天记录
            clearChat() {
                messageList = [];
                this.renderEmptyState();
            }
        };

        // 界面控制函数
        function unlockApp() {
            isAuthenticated = true;
            elements.lockScreen.classList.add('hidden');
            setTimeout(() => {
                elements.lockScreen.classList.add('removed');
            }, 400);
            elements.appContainer.style.opacity = '1';

            // 检查配置
            if (!aiConfigManager.isConfigValid()) {
                setTimeout(() => {
                    utils.showToast('请先配置API信息', 3000);
                    openSettings();
                }, 500);
            }
        }

        function openSettings() {
            elements.settingsPanel.style.display = 'flex';
            aiConfigManager.fillConfigToForm();
        }

        function closeSettings() {
            elements.settingsPanel.style.display = 'none';
        }

        // 事件监听
        function initEventListeners() {
            // 认证相关事件
            elements.authRegisterButton.addEventListener('click', async () => {
                const success = await faceIdAuth.register();
                if (success) {
                    faceIdAuth.initAuthState();
                    unlockApp();
                }
            });

            elements.authUnlockButton.addEventListener('click', async () => {
                const success = await faceIdAuth.authenticate();
                if (success) {
                    unlockApp();
                }
            });

            // 输入框相关事件
            elements.messageInput.addEventListener('input', () => {
                utils.autoResizeTextarea();
                elements.sendButton.disabled = elements.messageInput.value.trim() === '' || isGenerating;
            });

            elements.messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    const content = elements.messageInput.value;
                    if (content.trim() && !isGenerating) {
                        chatManager.sendMessage(content);
                    }
                }
            });

            // 发送按钮事件
            elements.sendButton.addEventListener('click', () => {
                const content = elements.messageInput.value;
                if (content.trim() && !isGenerating) {
                    chatManager.sendMessage(content);
                }
            });

            // 设置相关事件
            elements.settingsButton.addEventListener('click', openSettings);
            elements.settingsCloseButton.addEventListener('click', closeSettings);
            elements.settingsPanel.addEventListener('click', (e) => {
                if (e.target === elements.settingsPanel) {
                    closeSettings();
                }
            });

            // 配置按钮事件
            elements.settingsSaveButton.addEventListener('click', () => {
                const success = aiConfigManager.saveConfig();
                if (success) {
                    closeSettings();
                }
            });
            elements.settingsResetButton.addEventListener('click', aiConfigManager.resetConfig);
            elements.settingsTestButton.addEventListener('click', () => {
                aiConfigManager.testConfig();
            });
        }

        // 初始化函数
        function init() {
            // 加载配置
            aiConfigManager.loadConfig();
            // 初始化认证状态
            faceIdAuth.initAuthState();
            // 初始化事件监听
            initEventListeners();
            // 渲染空状态
            chatManager.renderEmptyState();
